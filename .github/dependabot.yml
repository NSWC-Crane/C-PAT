version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: uv
    directory: "/docs"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docs)"
    groups:
      docs-python:
        patterns:
          - "*"
