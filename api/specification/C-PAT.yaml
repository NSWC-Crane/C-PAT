openapi: 3.1.2
info:
  title: C-PAT API
  description: An API for managing POAMs.
  contact:
    name: Christian Rodriguez
    email: christian.a.rodriguez8.ctr@us.navy.mil
  license:
    name: C-PAT™ SOFTWARE OPEN SOURCE LICENSE AGREEMENT
    url: https://github.com/NSWC-Crane/C-PAT/blob/main/LICENSE.MD
  version: '1.4.4'
servers:
  - url: ''
paths:
  '/aaPackages':
    get:
      summary: Return all A&A Packages
      operationId: getAAPackages
      responses:
        '200':
          description: A&A Packages array response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/aaPackage_Object'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        default:
          $ref: '#/components/responses/unexpectedError'
      tags:
        - AAPackage
      security:
        - oauth:
            - 'c-pat:read'

  '/aaPackage/{aaPackageId}':
    parameters:
      - in: path
        name: aaPackageId
        required: true
        schema:
          type: integer
    get:
      summary: Return an A&A Package Name by aaPackageId
      operationId: getAAPackage
      responses:
        '200':
          description: A&A Package object response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aaPackage_Object'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        default:
          $ref: '#/components/responses/unexpectedError'
      tags:
        - AAPackage
      security:
        - oauth:
            - 'c-pat:read'
    delete:
      summary: Delete an A&A Package by aaPackageId
      operationId: deleteAAPackage
      responses:
        '204':
          description: A&A Package deleted successfully
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        default:
          $ref: '#/components/responses/unexpectedError'
      tags:
        - AAPackage
      security:
        - oauth:
            - 'c-pat:op'

  '/aaPackage':
    post:
      summary: Add an A&A Package
      operationId: postAAPackage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aaPackage_Object'
      responses:
        '201':
          description: A&A Package created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aaPackage_Object'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        default:
          $ref: '#/components/responses/unexpectedError'
      tags:
        - AAPackage
      security:
        - oauth:
            - 'c-pat:op'
    put:
      summary: Update an A&A Package
      operationId: putAAPackage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/aaPackage_Object'
                - required:
                    - aaPackageId
      responses:
        '200':
          description: A&A Package updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aaPackage_Object'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        default:
          $ref: '#/components/responses/unexpectedError'
      tags:
        - AAPackage
      security:
        - oauth:
            - 'c-pat:op'

  /ai/mitigation:
    post:
      summary: Generate mitigation statement using AI
      operationId: generateMitigation
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              description: The prompt for generating mitigation
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  mitigation:
                    type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        default:
          $ref: '#/components/responses/unexpectedError'
      tags:
        - AI
      security:
        - oauth:
            - 'c-pat:read'

