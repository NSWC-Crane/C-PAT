        maxDuration:
          type: number
        maxDurationUpdates:
          type: number
        retried:
          type: number
        averageRetries:
          type: number
        totalResLength:
          type: number
        minResLength:
          type: number
        maxResLength:
          type: number
        totalReqLength:
          type: number
        minReqLength:
          type: number
        maxReqLength:
          type: number
        projections:
          type: object
        clients:
          type: object
