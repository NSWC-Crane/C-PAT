            additionalProperties: true
            properties:
              poamId:
                type: integer
              vulnerabilityId:
                type: [string, 'null']
              vulnerabilitySource:
                type: [string, 'null']
              stigBenchmarkId:
                type: [string, 'null']
              status:
                type: [string, 'null']
              isGlobalFinding:
                type: boolean
              associatedVulnerabilities:
                type: array
                items:
                  type: string
              assignedTeams:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  properties:
                    assignedTeamId:
                      type: integer
                    assignedTeamName:
                      type: string
                    automated:
                      type: boolean
              assets:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  properties:
                    assetId:
                      type: integer
                    assetName:
                      type: [string, 'null']
    collection_team_sync_request:
      type: object
      required:
        - changes
      additionalProperties: false
      properties:
        changes:
          type: array
          maxItems: 100
          description: The assigned-team additions and removals to apply, one entry per POAM.
          items:
            type: object
            required:
              - poamId
              - add
              - remove
            additionalProperties: false
            properties:
              poamId:
                type: integer
                minimum: 1
              add:
                type: array
                description: Team ids to assign with automated set; teams already assigned are left unchanged.
                items:
                  type: integer
                  minimum: 1
              remove:
                type: array
                description: Team ids to unassign; only teams whose assignment is automated are removed.
                items:
                  type: integer
                  minimum: 1
    collection_team_sync_result:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            type: object
            required:
              - poamId
              - added
              - removed
            additionalProperties: true
            properties:
              poamId:
                type: [integer, 'null']
              added:
                type: array
                items:
                  type: integer
              removed:
                type: array
                items:
                  type: integer
              unknown:
                type: array
                description: Team ids that were requested but no longer exist; they were skipped.
                items:
                  type: integer
              skipped:
                type: string
                enum:
                  - closed
                  - not in collection
              error:
                type: string
    permission_write_result:
      type: object
      description: >-
        The outcome of setting a user's direct permission on a collection. A collection permission is the highest of
        the user's direct grant and any grant a team assignment justifies, so the level an administrator sets is not
        always the level the user ends up with.
      additionalProperties: true
      properties:
        userId:
          type: integer
        collectionId:
          type: integer
        accessLevel:
          type: integer
          description: The direct grant that was recorded, which is what the administrator asked for.
        effectiveAccessLevel:
          type: [integer, 'null']
          description: The level the user now holds on this collection.
        teamFloor:
          type: [integer, 'null']
          description: The highest level any team assignment grants for this collection, or null when no team covers it.
        coveringTeams:
          type: array
          description: Names of the teams whose coverage grants this collection to this user.
          items:
            type: string

    permission_delete_result:
      type: object
      description: The outcome of removing a user's direct permission on a collection.
      additionalProperties: true
      properties:
        userId:
          type: integer
        collectionId:
          type: integer
        removed:
          type: boolean
          description: True when the user no longer holds any access to the collection.
        effectiveAccessLevel:
          type: [integer, 'null']
          description: The level the user retains from team coverage, or null when access is gone entirely.
        teamFloor:
          type: [integer, 'null']
          description: The highest level any team assignment grants for this collection, or null when no team covers it.
        coveringTeams:
          type: array
          description: Names of the teams whose coverage still grants this collection to this user.
          items:
            type: string

    permission_grant_plan:
      type: object
      description: The additions, escalations and downgrades a team assignment would perform.
      additionalProperties: true
      properties:
        additions:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              collectionId:
                type: integer
              collectionName:
                type: string
              accessLevel:
                type: integer
        updates:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              collectionId:
                type: integer
              collectionName:
                type: string
              oldAccessLevel:
                type: integer
              newAccessLevel:
                type: integer
        downgrades:
          type: array
          description: >-
            Permissions that would be lowered because the team's access level was lowered. The new level is the highest
            of the user's direct grant, any other team's grant, and this team's new level, so a downgrade never drops
            access below what another source justifies.
          items:
            type: object
            additionalProperties: true
            properties:
              collectionId:
                type: integer
              collectionName:
                type: string
              oldAccessLevel:
                type: integer
              newAccessLevel:
                type: integer
        unchanged:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              collectionId:
                type: integer
              collectionName:
                type: string
              accessLevel:
                type: integer
        excluded:
          type: array
          description: >-
            Collections this team covers that an administrator deliberately skipped for this user when the coverage was
            added. They are left untouched by this assignment, and stay that way until the exclusion is cleared by
            listing the collection in includeCollectionIds or by removing and re-adding the team's coverage of it.
          items:
            type: object
            additionalProperties: true
            properties:
              collectionId:
                type: integer
              collectionName:
                type: string
              currentAccessLevel:
                type: [integer, 'null']
              wouldGrantAccessLevel:
                type: integer

    permission_revocation_plan:
      type: object
      description: >-
        What removing a team assignment would do to the permissions that assignment justifies. An empty plan means
        nothing attributable was found.
      additionalProperties: true
      properties:
        removals:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              collectionId:
                type: integer
              collectionName:
                type: string
              currentAccessLevel:
                type: integer
        downgrades:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              collectionId:
                type: integer
              collectionName:
                type: string
              currentAccessLevel:
                type: integer
              targetAccessLevel:
                type: integer
        unaffected:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              collectionId:
                type: integer
              collectionName:
                type: string
              currentAccessLevel:
                type: integer

    coverage_revocation_plan:
      type: object
      description: >-
        What removing a collection from a team's coverage would do to every member of that team. Entries carry the
        member they apply to, since one coverage removal affects the whole team.
      additionalProperties: true
      properties:
        removals:
          type: array
          items:
            $ref: '#/components/schemas/coverage_revocation_entry'
        downgrades:
          type: array
          items:
            $ref: '#/components/schemas/coverage_revocation_entry'
        unaffected:
          type: array
          items:
            $ref: '#/components/schemas/coverage_revocation_entry'

    coverage_revocation_entry:
      type: object
      additionalProperties: true
      properties:
        userId:
          type: integer
        userName:
          type: string
        fullName:
          type: [string, 'null']
        collectionId:
          type: integer
        collectionName:
          type: string
        currentAccessLevel:
          type: integer
        targetAccessLevel:
          type: integer
          description: Present on downgrades only.

    coverage_grant_plan:
      type: object
      description: >-
        What adding a collection to a team's coverage would grant every member of that team. The plan can only add or
        raise access; a member already holding more than the team's level lands in unchanged and keeps it.
      additionalProperties: true
      properties:
        additions:
          type: array
          items:
            $ref: '#/components/schemas/coverage_grant_entry'
        updates:
          type: array
          items:
            $ref: '#/components/schemas/coverage_grant_entry'
        unchanged:
          type: array
          items:
            $ref: '#/components/schemas/coverage_grant_entry'

    coverage_grant_entry:
      type: object
      additionalProperties: true
      properties:
        userId:
          type: integer
        userName:
          type: string
        fullName:
          type: [string, 'null']
        teamAccessLevel:
          type: integer
          description: The member's access level on this team, which is what the coverage records as granted.
        currentAccessLevel:
          type: [integer, 'null']
          description: The member's effective access today. Null on additions, where they hold none.
        newAccessLevel:
          type: integer
          description: >-
            Present on additions and updates. The effective level the member would end up with, which is the highest
            of their direct grant, any other team's grant, and this team's level.
        accessLevel:
          type: integer
          description: Present on unchanged only.

    user_Create:
      type: object
      required:
        - userName
      additionalProperties: true
      properties:
        userName:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 100
        phoneNumber:
          type: string
          maxLength: 20
        firstName:
          type: string
          maxLength: 50
        lastName:
          type: string
          maxLength: 50
        officeOrg:
          type: [string, 'null']
          maxLength: 100
        accountStatus:
          type: string
          maxLength: 25

    user_Update:
      type: object
      required:
        - userId
        - email
        - firstName
        - lastName
        - accountStatus
        - lastCollectionAccessedId
      additionalProperties: true
      properties:
        userId:
          type: integer
        email:
          type: string
        phoneNumber:
          type: string
        lastAccess:
          type: [string, 'null']
        firstName:
          type: string
          maxLength: 50
        lastName:
          type: string
          maxLength: 50
        accountStatus:
          type: string
          maxLength: 45
        officeOrg:
          type: [string, 'null']
          maxLength: 100
        lastCollectionAccessedId:
          type: integer
        defaultTheme:
          type: [string, 'null']
          maxLength: 255
        lastClaims:
          type: [object, 'null']
        points:
          type: [integer, 'null']

    user_Permissions:
      type: object
      required:
        - userId
        - collectionId
        - accessLevel
      additionalProperties: true
      properties:
        userId:
          type: integer
        collectionId:
          type: integer
        accessLevel:
          type: integer
          minimum: 1
          maximum: 4
        firstName:
          type: string
        lastName:
          type: string
        fullName:
          type: string
        email:
          type: string

    update_user_Permissions:
      type: object
      required:
        - userId
        - oldCollectionId
        - accessLevel
      additionalProperties: true
      properties:
        userId:
          type: integer
        oldCollectionId:
          type: integer
          description: Identifies the permission to update. A permission cannot be moved to a different collection.
        accessLevel:
          type: integer
          minimum: 1
          maximum: 4
        firstName:
          type: string
        lastName:
          type: string
        fullName:
          type: string
        email:
          type: string

    user_team_assignment:
      type: object
      required:
        - userId
        - assignedTeamId
        - accessLevel
      additionalProperties: true
      properties:
        userId:
          type: integer
        assignedTeamId:
          type: integer
        accessLevel:
          type: integer
          minimum: 1
          maximum: 4
        fullName:
          type: string
        userName:
          type: string
        email:
          type: string
        includeCollectionIds:
          type: array
          items:
            type: integer
          description: >-
            Collections this team covers that were previously skipped for this user and should now be granted again.
            Clearing the exclusion is all this does; the grant itself still comes from the team's coverage, so an id
            the team does not cover has no effect.

    Username:
      $ref: '#/components/schemas/String255'

    update_user_team_assignment:
      type: object
      required:
        - userId
        - oldAssignedTeamId
      additionalProperties: true
      properties:
        userId:
          type: integer
        oldAssignedTeamId:
          type: integer
          description: Identifies the assignment to update. The team an assignment points at cannot be changed.
        accessLevel:
          type: integer
          minimum: 1
          maximum: 4
          description: >-
            The access level to store on the assignment. When omitted, the stored level is kept and the covered
            collections are re-synced at that level, which is how exclusions are restored without touching the level.
        includeCollectionIds:
          type: array
          items:
            type: integer
          description: >-
            Collections this team covers that were previously skipped for this user and should now be granted again.
            Clearing the exclusion is all this does; the grant itself still comes from the team's coverage, so an id
            the team does not cover has no effect.

  responses:
    forbidden:
      description: The requesting User does not have access rights to the content
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    unexpectedError:
      description: >-
        Any status not listed for the operation. The body is the error object for 401 (a required access
        token is missing, or the presented token is expired or invalid), 403 (the token lacks the required
        scope), 405 (method not allowed on this path), 413 (request body exceeds the size limit), and 415
        (unsupported request media type). Two responses do not carry the error object: 429 (rate limit
        exceeded) is text rather than JSON, and 503 (database or identity provider unavailable,
        including during startup) is the service-state object with state, stateDate, mode, and
        dependencies.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    tenableUpstreamError:
      description: >-
        C-PAT could not reach Tenable, the request sat idle longer than TENABLE_TIMEOUT allows, or Tenable
        returned a response C-PAT could not relay. detail carries the underlying error message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

    tenableUnavailable:
      description: >-
        The Tenable integration is not configured for this deployment (TENABLE_URL is unset or empty). A
        503 carrying the service-state object instead of the error object means the database or identity
        provider is unavailable; see the default response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'

  parameters:
    ElevateQuery:
      name: elevate
      in: query
      description: Elevate the user context for this request if user is permitted (isAdmin)
      schema:
        type: boolean
        default: false

    collectionIdPath:
      name: collectionId
      in: path
      description: A path parameter that identifies a Collection
      required: true
      schema:
        type: string

    JsonPathQuery:
      name: jsonpath
      in: query
      description: A JSONPath expression
      schema:
        $ref: '#/components/schemas/String255'

  securitySchemes:
    oauth:
      type: openIdConnect
      openIdConnectUrl: ''
