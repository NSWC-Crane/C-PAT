      security:
        - oauth:
            - 'c-pat:read'

  /assets/delta/list:
    get:
      summary: Return a master list of assets for delta comparison
      operationId: getAssetDeltaList
      responses:
        '200':
          description: Asset array response
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        value:
                          type: string
                        eMASS:
                          type: [boolean, 'null']
                        assignedTeam:
                          type: [object, 'null']
                          properties:
                            assignedTeamId:
                              type: integer
                            assignedTeamName:
                              type: string
                          required:
                            - assignedTeamId
                            - assignedTeamName
                      required:
                        - key
                        - value
                required:
                  - assets
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        default:
          $ref: '#/components/responses/unexpectedError'
      tags:
        - Asset
      security:
        - oauth:
            - 'c-pat:op'

  /assets/delta/list/{collectionId}:
    parameters:
      - in: path
        name: collectionId
        required: true
        schema:
          type: integer
    get:
      summary: Return a master list of assets for delta comparison
      operationId: getAssetDeltaListByCollection
      responses:
        '200':
          description: Asset array response
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        value:
                          type: string
                        eMASS:
                          type: [boolean, 'null']
                        collectionId:
                          type: [integer, 'null']
                        assignedTeam:
                          type: [object, 'null']
                          properties:
                            assignedTeamId:
                              type: integer
                            assignedTeamName:
                              type: string
                          required:
                            - assignedTeamId
                            - assignedTeamName
                      required:
                        - key
                        - value
                  assetDeltaUpdated:
                    type: [string, 'null']
                  emassHardwareListUpdated:
                    type: [string, 'null']
                required:
                  - assets
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        default:
          $ref: '#/components/responses/unexpectedError'
      tags:
        - Asset
      security:
        - oauth:
            - 'c-pat:op'

  /assets/collection/{collectionId}:
