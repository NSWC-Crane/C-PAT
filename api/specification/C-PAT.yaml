      summary: Add a poamApprover
      operationId: postPoamApprover
      description: >-
        Adds a user to a POAM's approver list. Requires accessLevel 2 or higher on the POAM's collection;
        administrators bypass the check. Re-adding an existing approver is idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/poamApprover_Request'
      responses:
        '201':
