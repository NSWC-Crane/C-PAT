          type: integer
        assetName:
          type: string
        fullyQualifiedDomainName:
          type: [string, 'null']
        collectionId:
          type: integer
        description:
          type: [string, 'null']
        ipAddress:
          type: [string, 'null']
        macAddress:
          type: [string, 'null']
        nonComputing:
          type: [integer, 'null']
        assetOrigin:
          type: [string, 'null']

    assetLabel_Object:
      type: object
      required:
        - assetId
        - collectionId
        - labelId
      additionalProperties: true
      properties:
        assetId:
          type: integer
        collectionId:
          type: integer
        labelId:
          type: integer

    collection:
      type: object
      required:
        - collectionName
      additionalProperties: true
      properties:
        collectionId:
          type: integer
        collectionName:
          type: string
        description:
          type: [string, 'null']
        systemType:
          type: [string, 'null']
        systemName:
          type: [string, 'null']
        ccsafa:
          type: [string, 'null']
        aaPackage:
          type: [string, 'null']
        predisposingConditions:
          type: [string, 'null']
        created:
          type: string
          format: date
        collectionType:
          type: [string, 'null']
        originCollectionId:
          type: [integer, 'null']
        manualCreationAllowed:
          type: [boolean, 'null']
    collectionBasicList:
      type: object
      additionalProperties: false
      properties:
        collectionId:
          type: integer
        collectionName:
          type: string
        collectionType:
          type: [string, 'null']
        originCollectionId:
          type: [integer, 'null']
        systemType:
          type: [string, 'null']
        systemName:
          type: [string, 'null']
        ccsafa:
          type: [string, 'null']
        aaPackage:
          type: [string, 'null']
        predisposingConditions:
          type: [string, 'null']
        manualCreationAllowed:
          type: boolean
          default: true

    error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        detail:
          type: string
        stack:
          type: string

    SuccessResponse:
      type: object
      properties:
        message:
          type: string

    label_Object:
      type: object
      required:
        - labelName
        - collectionId
      additionalProperties: true
      properties:
        labelId:
          type: integer
        collectionId:
          type: integer
        labelName:
          type: string
        description:
          type: string

    tenableFilter_Object:
      type: object
      required:
        - filterName
        - collectionId
      additionalProperties: false
      properties:
        filterId:
          type: integer
        collectionId:
          type: integer
        filterName:
          type: string
        filter:
          type: string
        createdBy:
          type: [string, 'null']

    tenableResponse:
      type: object
      description: >-
        The Tenable.sc response envelope. C-PAT relays the upstream body unmodified, so response is
        opaque and its shape depends on the operation. A non-zero error_code with a populated error_msg
        indicates a Tenable-level failure that is still delivered with HTTP 200.
      properties:
        type:
          type: string
        response: {}
        error_code:
          type: integer
        error_msg:
          type: string
        warnings:
          type: array
          items: {}
        timestamp:
          type: integer

    aaPackage_Object:
      type: object
      required:
        - aaPackage
      properties:
        aaPackageId:
          type: integer
        aaPackage:
          type: string

    appConfiguration_Object:
      type: object
      required:
        - settingName
        - settingValue
      properties:
        settingName:
          type: string
        settingValue:
          type: string

    assignedTeam_Object:
      type: object
      required:
        - assignedTeamName
      properties:
        assignedTeamId:
          type: integer
        assignedTeamName:
          type: string
        adTeam:
          type: [string, 'null']
        automated:
          type: boolean
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/permission_Object'
          description: Array of collection IDs this team has access to

    assignedTeamPermission_Request:
      type: object
      required:
        - assignedTeamId
        - collectionId
      properties:
        assignedTeamId:
          type: integer
          description: ID of the assigned team
        collectionId:
          type: integer
          description: ID of the collection to grant permission for
        grantUserIds:
          type: array
          items:
            type: integer
          description: >-
            Team members who should receive the collection permission this coverage implies. The server rebuilds the
            grant plan itself and only acts on ids that appear in it, so an id outside the team is ignored. Omitted or
            empty means no member gains access.
        previewedMembers:
          type: array
          description: >-
            Which bucket each member fell into when the plan behind `grantUserIds` was previewed, plus the access
            levels the preview displayed. The server rebuilds the plan and rejects the request with 409 if any
            member's bucket has changed, or if a supplied access level no longer matches the rebuilt plan, because
            `grantUserIds` is a bare id list and cannot say whether a member was left out deliberately or was never
            offered a choice. Required whenever the rebuilt plan contains members whose access would change.
          items:
            type: object
            required:
              - userId
              - bucket
            properties:
              userId:
                type: integer
              bucket:
                type: string
                enum:
                  - additions
                  - updates
                  - unchanged
              teamAccessLevel:
                type: integer
                description: The member's access level on the team as the preview displayed it. When present, the server rejects with 409 if it has since changed.
              newAccessLevel:
                type: integer
                description: >-
                  The effective level the preview promised for an addition or update. When present, the server rejects
                  with 409 if the rebuilt plan would grant a different level.

    assignedTeamPermission_Object:
      type: object
      required:
        - assignedTeamId
        - collectionId
      properties:
        assignedTeamId:
          type: integer
          description: ID of the assigned team
        collectionId:
          type: integer
          description: ID of the collection permission is granted for
        granted:
          type: object
          additionalProperties: true
          properties:
            additions:
              type: integer
            updates:
              type: integer
            unchanged:
              type: integer
            excluded:
              type: integer
        permissionChanges:
          $ref: '#/components/schemas/coverage_grant_plan'

    permission_Object:
      type: object
      required:
        - collectionId
        - collectionName
      properties:
        collectionId:
          type: integer
          description: ID of the collection this team has access to
        collectionName:
          type: string
          description: Name of the collection this team has access to

    IAVTableData:
      type: object
      properties:
        iav:
          type: string
        pluginID:
          type: [string, 'null']
          description: Comma-separated list of plugin IDs associated with this IAV
        status:
          type: [string, 'null']
        title:
          type: string
        iavCat:
          type: [integer, 'null']
          format: int32
        type:
          type: string
          maxLength: 1
        releaseDate:
          type: [string, 'null']
          format: date
        navyComplyDate:
          type: [string, 'null']
          format: date
        supersededBy:
          type: [string, 'null']
        knownExploits:
          type: [string, 'null']
        knownDodIncidents:
          type: [string, 'null']
        nessusPlugins:
          type: integer
          format: int32
        taskOrder:
          type: [string, 'null']
          maxLength: 25
      required:
        - iav
        - title
        - type

    notification:
      type: object
      properties:
        notificationId:
          type: integer
        userId:
          type: integer
        title:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        read:
          type: integer
      required:
        - notificationId
        - userId
        - title
        - message
        - timestamp
        - read

    poamApprover_Object:
      type: object
      required:
        - poamId
        - userId
        - approvalStatus
      additionalProperties: true
      properties:
        poamId:
          type: integer
        userId:
          type: integer
        approvalStatus:
          type: string
        approvedDate:
          type: [string, 'null']
          format: date
        comments:
          type: [string, 'null']
        hqs:
          type: [boolean, 'null']

    poamApprover_Request:
      type: object
      required:
        - poamId
        - userId
      additionalProperties: true
      properties:
        poamId:
          type: integer
        userId:
          type: integer
        approvalStatus:
          type: string
        approvedDate:
          type: [string, 'null']
          format: date
        comments:
          type: [string, 'null']
        hqs:
          type: [boolean, 'null']

    poamApprover_Response:
      type: object
      required:
        - poamId
        - userId
        - approvalStatus
      additionalProperties: true
      properties:
        poamId:
          type: integer
        userId:
          type: integer
        approvalStatus:
          type: string
        approvedDate:
          type: [string, 'null']
          format: date
        comments:
          type: [string, 'null']

    poamAssignedTeam_Object:
      type: object
      required:
        - poamId
        - assignedTeamId
      additionalProperties: true
      properties:
        poamId:
          type: integer
        assignedTeamId:
          type: integer
        assignedTeamName:
          type: string
        adTeam:
          type: [string, 'null']
        automated:
          type: boolean
        poamStatus:
          type: string
        complete:
          type: [string, 'null']

    poamAssets_Object:
      type: object
      required:
        - poamId
        - assetId
      additionalProperties: true
      properties:
        poamId:
          type: integer
        assetId:
          type: integer

    PoamAttachment_Object:
      type: object
      properties:
        attachmentId:
          type: integer
        poamId:
          type: integer
        filename:
          type: string
        fileSize:
          type: integer
        mimeType:
          type: string
        uploadDate:
          type: string
          format: date-time
        uploadedBy:
          type: integer

    chatMessage:
      type: object
      properties:
        messageId:
          type: integer
          description: Unique identifier for the message
        userId:
          type: integer
          description: ID of the user who created the message
        poamId:
          type: integer
          description: ID of the POAM this message belongs to
        text:
          type: string
          description: Message content
        createdAt:
          type: string
          format: date-time
          description: When the message was created
        user:
          type: object
          properties:
            firstName:
              type: string
            lastName:
              type: string
            userName:
              type: string

    poamExtensionObject:
      type: object
      description: >-
        The extension attached to a POAM, used as both the PUT /poamExtension request body and the response shape for
        GET /poamExtension/{poamId} and PUT /poamExtension. On PUT only poamId is required: extensionDays and status
        are preserved when absent or null, the text fields are PATCH-style (absent preserves, null clears), and
        extensionDeadline, extensionHistory and serverToday are response-only.
      required:
        - poamId
      additionalProperties: true
      properties:
        poamId:
          type: integer
          description: The ID of the POAM this extension belongs to. Required on PUT.
        extensionDays:
          type: [integer, 'null']
          description: >-
            Number of days the POAM deadline is extended by. Absent or null preserves the stored value; 0 clears the
            extension and forces extensionDeadline to null. Changing it to a different non-zero value requires
            reanchorDeadline to be true.
        extensionDeadline:
          type: [string, 'null']
          format: date
          description: >-
            Response-only. The date the extension expires as a "YYYY-MM-DD" string; moved only when the request
            re-anchors and forced to null when the effective extensionDays is 0 or null.
        extensionJustification:
          type: [string, 'null']
          description: Justification for the extension request. PATCH-style on PUT - absent preserves, null clears.
        mitigations:
          type: [string, 'null']
          description: PATCH-style on PUT - absent preserves, null clears.
        requiredResources:
          type: [string, 'null']
          description: PATCH-style on PUT - absent preserves, null clears.
        residualRisk:
          type: [string, 'null']
          description: PATCH-style on PUT - absent preserves, null clears.
        likelihood:
          type: [string, 'null']
          description: PATCH-style on PUT - absent preserves, null clears.
        localImpact:
          type: [string, 'null']
          description: PATCH-style on PUT - absent preserves, null clears.
        impactDescription:
          type: [string, 'null']
          description: PATCH-style on PUT - absent preserves, null clears.
        status:
          type: [string, 'null']
          description: >-
            The POAM status to apply alongside the extension. Absent or null preserves the stored status; a supplied
            value must be the POAM's current status or one of "Extension Requested", "Approved" and "Rejected".
        reanchorDeadline:
          type: boolean
          description: >-
            Decides whether this request restarts the extension period. When true, extensionDeadline becomes the
            current date plus the effective extensionDays, a history row is recorded and approvers are notified;
            requires extensionDays greater than zero. When false, the deadline is never moved forward. When omitted,
            legacy behavior re-anchors only when status is explicitly set to "Extension Requested"; omitting the field
            is deprecated. Whenever the deadline moves, the deadline reminders reset; the halfway reminder never
            resets.
        extensionHistory:
          type: array
          description: Response-only. One entry per recorded re-anchor of this POAM's extension.
          items:
            type: object
            properties:
              extensionHistoryId:
                type: integer
              extensionRequestedDate:
                type: string
                format: date
              extensionDays:
                type: integer
        serverToday:
          type: string
          format: date
          description: >-
            Response-only. The database server's current date as a "YYYY-MM-DD" string, so a client can anchor a
            previewed extension deadline to the server's date rather than the browser's.

