  '/poam':
    post:
      summary: Add a POAM
      operationId: postPoam
      description: >-
        Creates a POAM. Requires accessLevel 2 or higher on the collection named by collectionId, and the requested
        status is subject to the same allowlist as PUT /poam, measured against the request body's rawSeverity.
        Administrators bypass both checks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/poam_Object'
      responses:
        '201':
          description: POAM added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/poam_Object'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '403':
          description: Forbidden - insufficient privileges for the collection or the requested status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '409':
          description: A POAM already exists for this vulnerability ID within the collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        default:
          $ref: '#/components/responses/unexpectedError'
      tags:
        - Poam
      security:
        - oauth:
            - 'c-pat:write'
    put:
      summary: Update a POAM
      operationId: putPoam
      description: >-
        Updates a POAM. Requires accessLevel 2 or higher on the POAM's collection, and on the destination collection
        when changing collectionId. Status changes are allowlisted: "Draft", "Closed", "Expired" and "Submitted" need
        accessLevel 2, "Approved" needs accessLevel 3 - or accessLevel 4 when the stored or requested rawSeverity is
        "CAT I - Critical" or "CAT I - High" - and every other status needs accessLevel 3. A request that leaves
        status equal to the stored status is not treated as a status change. Administrators bypass all checks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/poam_Object'
      responses:
        '200':
          description: POAM updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/poam_Object'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '403':
          description: Forbidden - insufficient privileges for the collection, the destination collection, or the requested status change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: POAM not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '409':
          description: A POAM already exists for this vulnerability ID within the collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        default:
          $ref: '#/components/responses/unexpectedError'
      tags:
        - Poam
      security:
        - oauth:
            - 'c-pat:write'

