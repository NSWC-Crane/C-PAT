          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        default:
          $ref: '#/components/responses/unexpectedError'
      tags:
        - Collection
      security:
        - oauth:
            - 'c-pat:op'
    post:
      summary: Apply asset-mapping team changes to the POAMs of a collection
      description: >-
        Applies assigned-team additions and removals computed from the collection's asset delta rules, at most 100
        POAMs per request. Each POAM is applied in its own transaction. Closed POAMs, POAMs outside the collection,
        and teams that were assigned manually are never changed; the outcome for every POAM is reported in the
        response. Administrator only.
      operationId: postCollectionTeamSync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/collection_team_sync_request'
      responses:
        '200':
          description: Team sync changes processed; see results for the outcome of each POAM
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/collection_team_sync_result'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '403':
          description: Forbidden - insufficient privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
