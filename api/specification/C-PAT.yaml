  /asset:
    post:
      summary: Add an asset
      operationId: postAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AssetObject'
                - required:
                    - ipAddress
                  properties:
                    ipAddress:
                      type: string
                      minLength: 1
      responses:
        '201':
          description: Return the added asset response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetObject'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
