      security:
        - oauth:
            - 'c-pat:write'
    put:
      summary: Update an Asset
      operationId: putAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AssetObject'
                - required:
                    - assetId
                    - ipAddress
                  properties:
                    ipAddress:
                      type: string
                      minLength: 1
      responses:
        '200':
          description: Return the updated asset response
          content:
