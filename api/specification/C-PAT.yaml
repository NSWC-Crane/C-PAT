        name: userId
        required: true
        schema:
          type: integer
      - in: path
        name: assignedTeamId
        required: true
        schema:
          type: integer
    delete:
      summary: Remove a user from a team
      operationId: deleteTeamAssignment
      parameters:
        - name: revokePermissions
          in: query
          description: >-
            When true, revoke the permissions this team assignment justified, floored by the user's own direct grant
            and by any other team still granting the collection. When false or absent the user keeps their access,
            which is converted into a direct grant so it survives future team changes.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Team assignment deleted where the body reports what was actually applied.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  revoked:
                    type: boolean
                    description: Whether the caller asked to revoke rather than keep the access this assignment justified.
                  permissionChanges:
                    $ref: '#/components/schemas/permission_revocation_plan'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '403':
          description: Forbidden - insufficient privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        default:
          $ref: '#/components/responses/unexpectedError'
      tags:
        - UserTeamAssignments
      security:
        - oauth:
            - 'c-pat:op'

  '/user/{userId}/teams/{assignedTeamId}/grantPreview':
    parameters:
      - $ref: '#/components/parameters/ElevateQuery'
      - in: path
        name: userId
        required: true
        schema:
          type: integer
      - in: path
        name: assignedTeamId
        required: true
        schema:
          type: integer
    get:
      summary: Preview the permission changes a team assignment would make
      operationId: getGrantPreview
      parameters:
        - name: accessLevel
          in: query
          required: true
          description: The access level the assignment would be saved with.
          schema:
            type: integer
            minimum: 1
            maximum: 4
      responses:
        '200':
          description: Grant plan retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/permission_grant_plan'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '403':
          description: Forbidden - insufficient privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        default:
          $ref: '#/components/responses/unexpectedError'
      tags:
        - UserTeamAssignments
      security:
        - oauth:
            - 'c-pat:op'

  '/user/{userId}/teams/{assignedTeamId}/revocationPreview':
    parameters:
      - $ref: '#/components/parameters/ElevateQuery'
      - in: path
        name: userId
        required: true
        schema:
          type: integer
      - in: path
        name: assignedTeamId
        required: true
        schema:
          type: integer
    get:
      summary: Preview what removing a team assignment would do to the permissions it justifies
      operationId: getRevocationPreview
      responses:
        '200':
          description: Revocation plan retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/permission_revocation_plan'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '403':
          description: Forbidden - insufficient privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        default:
          $ref: '#/components/responses/unexpectedError'
      tags:
        - UserTeamAssignments
      security:
        - oauth:
            - 'c-pat:op'

  '/user/teams':
    post:
      summary: Add a user to a team
      operationId: postTeamAssignment
      parameters:
        - $ref: '#/components/parameters/ElevateQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/user_team_assignment'
      responses:
        '201':
          description: Team assignment created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/user_team_assignment'
                  - type: object
                    properties:
                      created:
                        type: boolean
                        description: >-
                          False when an assignment for this user and team already existed. In that case, the existing
                          access level was kept and the requested one ignored, so accessLevel in this response may
                          differ from the one submitted.
                      permissionChanges:
                        $ref: '#/components/schemas/permission_grant_plan'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '403':
          description: Forbidden - insufficient privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Assigned Team not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        default:
          $ref: '#/components/responses/unexpectedError'
      tags:
        - UserTeamAssignments
      security:
        - oauth:
            - 'c-pat:op'
    put:
      summary: Update a users team assignment
      operationId: putTeamAssignment
      parameters:
        - $ref: '#/components/parameters/ElevateQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update_user_team_assignment'
      responses:
        '200':
          description: Team assignment updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/user_team_assignment'
                  - type: object
                    properties:
                      permissionChanges:
                        $ref: '#/components/schemas/permission_grant_plan'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '403':
          description: Forbidden - insufficient privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Team assignment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        default:
          $ref: '#/components/responses/unexpectedError'
      tags:
        - UserTeamAssignments
      security:
        - oauth:
            - 'c-pat:op'

  '/vulnerability/poam/{vulnerabilityId}':
    parameters:
      - in: path
        name: vulnerabilityId
        required: true
        schema:
          type: string
    get:
      summary: Return POAMs by vulnerabilityId
      operationId: getPoamsByVulnerabilityId
      responses:
        '200':
          description: POAM array response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/poam_Object'
        '403':
          $ref: '#/components/responses/forbidden'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        default:
          $ref: '#/components/responses/unexpectedError'
      tags:
        - Vulnerability
      security:
        - oauth:
            - 'c-pat:read'

components:
  schemas:
    DailyCheck:
      type: object
      properties:
        date:
          type: string
          format: date
        status:
          type: integer
        downtimeMinutes:
          type: integer
    ServiceUptimeStatus:
      type: object
      properties:
        currentStatus:
          type: string
          enum:
            - operational
            - outage
            - unknown
        uptimePercent:
          type: [number, 'null']
        checks:
          type: array
          items:
            $ref: '#/components/schemas/DailyCheck'
    OptionalServiceUptimeStatus:
      type: object
      properties:
        available:
          type: boolean
        currentStatus:
          type: string
          enum:
            - operational
            - outage
            - unknown
        uptimePercent:
          type: [number, 'null']
        checks:
          type: array
          items:
            $ref: '#/components/schemas/DailyCheck'
    UptimeStatus:
      type: object
      properties:
        cpat:
          $ref: '#/components/schemas/ServiceUptimeStatus'
        oidc:
