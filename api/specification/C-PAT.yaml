        required: true
        schema:
          type: integer
    get:
      summary: Get the team sync snapshot of a collection
      description: >-
        Returns every POAM in the collection with the fields the asset-to-team mapping needs - vulnerability ids,
        status, the currently assigned teams with their automated flag, and C-PAT asset rows - in one response.
        Administrator only.
      operationId: getCollectionTeamSyncSnapshot
      responses:
        '200':
          description: Team sync snapshot retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/collection_team_sync_snapshot'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '403':
          description: Forbidden - insufficient privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: Collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
