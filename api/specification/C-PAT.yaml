        directPermissions:
          type: array
          description: >-
            Administrator-set provenance for collection permissions. Each entry records access granted to this user
            directly rather than through a team. A collection permission is the highest of the user's direct entry
            and every team grant for that collection, so every permission has at least one entry in one of the two
            lists.
          items:
            $ref: '#/components/schemas/collection_direct_permission'
        excludedGrants:
          type: array
          description: >-
            Collections a team covers that an administrator deliberately withheld from this user. Each entry suppresses
            the grant the team's coverage would otherwise justify, and survives future saves of the team assignment
            until it is restored or the assignment itself is removed.
          items:
            $ref: '#/components/schemas/collection_grant_exclusion'

