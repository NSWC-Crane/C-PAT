            grantedByName:
              type: [string, 'null']
        teamGrants:
          type: array
          description: The grants team coverage justifies for this user, one entry per covering team.
          items:
            $ref: '#/components/schemas/collection_permission_grant'
        exclusions:
          type: array
          description: Team coverage of this collection an administrator deliberately withheld from this user.
          items:
            $ref: '#/components/schemas/collection_grant_exclusion'

