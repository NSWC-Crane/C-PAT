        default:
          $ref: '#/components/responses/unexpectedError'
      tags:
        - Permissions
      security:
        - oauth:
            - 'c-pat:op'

  '/permission':
    post:
      summary: Add a user collection permission
      description: >-
        Records a direct grant for this user and collection, then recomputes the effective permission. The requested
        level is always stored as the direct grant; if a team grants more, `effectiveAccessLevel` is higher than
        `accessLevel` and `teamFloor` explains why.
      operationId: postPermission
      parameters:
        - $ref: '#/components/parameters/ElevateQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/user_Permissions'
      responses:
        '201':
          description: Permission created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/permission_write_result'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '403':
          description: Forbidden - insufficient privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        default:
          $ref: '#/components/responses/unexpectedError'
      tags:
        - Permissions
      security:
        - oauth:
            - 'c-pat:op'
    put:
      summary: Update user collection permissions
      description: >-
        Records a direct grant at the requested level, then recomputes the effective permission. A level below what a
        team grants is stored faithfully but does not lower the user's access; the response returns the higher
        `effectiveAccessLevel` along with the `teamFloor` holding it up.
      operationId: putPermission
      parameters:
        - $ref: '#/components/parameters/ElevateQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update_user_Permissions'
      responses:
        '200':
          description: Permission updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/permission_write_result'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '403':
          description: Forbidden - insufficient privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        default:
          $ref: '#/components/responses/unexpectedError'
      tags:
        - Permissions
      security:
        - oauth:
            - 'c-pat:op'

