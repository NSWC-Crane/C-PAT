  /poamExtension/{poamId}:
    get:
      summary: Return POAM extension by POAM ID
      operationId: getPoamExtension
      tags:
        - PoamExtension
      security:
        - oauth:
            - 'c-pat:read'
      parameters:
        - in: path
          name: poamId
          schema:
            type: integer
          required: true
          description: The ID of the POAM
      responses:
        '200':
          description: >-
            POAM extension details, or an empty array if no extension exists. The array holds at most one element and
            date properties are returned as "YYYY-MM-DD" strings. Requires accessLevel 1 or higher on the POAM's
            collection.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/poamExtensionObject'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '403':
          $ref: '#/components/responses/forbidden'
        default:
          $ref: '#/components/responses/unexpectedError'
    delete:
      summary: Delete POAM extension by POAM ID
      operationId: deletePoamExtension
      tags:
        - PoamExtension
      security:
        - oauth:
            - 'c-pat:write'
      parameters:
        - in: path
          name: poamId
          schema:
            type: integer
          required: true
          description: The ID of the POAM
      responses:
        '200':
          description: >-
            Extension removed. extensionDays is set to 0 and extensionJustification and extensionDeadline are cleared.
            An "Extension Requested" status reverts to "Submitted" and the POAM's approvers are notified; any other
            status is left untouched. Deadline reminders reset against the scheduled completion date and extension
            history is retained. Requires accessLevel 2 or higher on the POAM's collection.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    examples: ['POAM extension deleted successfully']
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          description: POAM not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        default:
          $ref: '#/components/responses/unexpectedError'

  /poamExtension:
    put:
      summary: Add or update POAM extension
      description: >-
        Adds or updates the extension attached to a POAM. The body is a presence-based partial update: extensionDays
        and status are preserved when absent or null, the text fields are PATCH-style (absent preserves, null clears),
        and deadline movement is controlled by reanchorDeadline. Re-anchoring records a history row and notifies the
        POAM's approvers unless the request changes nothing. Requires accessLevel 2 or higher on the POAM's
        collection; changing status to "Approved" or "Rejected" requires accessLevel 3, and "Approved" on a POAM whose
        rawSeverity is "CAT I - Critical" or "CAT I - High" requires accessLevel 4.
      operationId: putPoamExtension
      tags:
        - PoamExtension
      security:
        - oauth:
            - 'c-pat:write'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/poamExtensionObject'
      responses:
        '200':
          description: POAM extension updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/poamExtensionObject'
        '400':
          description: >-
            Bad request. Returned when poamId is falsy, when reanchorDeadline is true without a positive extensionDays,
            when extensionDays changes while reanchorDeadline is false, or when a supplied status is neither the POAM's
            current status nor one of "Extension Requested", "Approved" and "Rejected".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '403':
          description: Forbidden - insufficient privileges for the collection or the requested status change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: POAM not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        default:
          $ref: '#/components/responses/unexpectedError'

