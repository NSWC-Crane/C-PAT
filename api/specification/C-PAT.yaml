        name: userId
        required: true
        schema:
          type: integer
      - in: path
        name: collectionId
        required: true
        schema:
          type: integer
    delete:
      summary: Remove a user's direct collection permission
      description: >-
        Removes the direct grant an administrator set for this user and collection, then recomputes the effective
        permission from what remains. If a team still covers the collection the user keeps access at the team's level
        and `removed` is false; use the team assignment or the team's coverage to take that access away.
      operationId: deletePermission
      responses:
        '200':
          description: Direct permission removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/permission_delete_result'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
