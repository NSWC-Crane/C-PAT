<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Silent Renew</title>
  </head>

  <body>
    <script>
      globalThis.onload = function () {
        const event = new CustomEvent('oidc-silent-renew-message', {
          detail: { url: globalThis.location, srcFrameId: globalThis.frameElement?.id }
        });
        globalThis.parent.dispatchEvent(event);
      };
    </script>
  </body>
</html>
