<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" font-family="Lato, Helvetica, Arial, sans-serif" font-size="14">
  <title>C-PAT schema bootstrap and migration flow</title>
  <desc>At startup the API imports the baseline schema when the database is empty, then applies pending Umzug migrations, each in one transaction, recording them in the _migrations table.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c9cdd1"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="680" rx="8" fill="#252525"/>

  <rect x="300" y="20" width="400" height="44" rx="8" fill="#14304a" stroke="#249ee8" stroke-width="1.5"/>
  <text x="500" y="47" text-anchor="middle" fill="#e0e0e0" font-weight="bold">API start: initializeDatabase()</text>
  <line x1="500" y1="64" x2="500" y2="86" stroke="#c9cdd1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="88" width="400" height="56" rx="8" fill="#14304a" stroke="#249ee8" stroke-width="1.5"/>
  <text x="500" y="110" text-anchor="middle" fill="#e0e0e0">pool, preflight connection, version gate</text>
  <text x="500" y="130" text-anchor="middle" fill="#a7aeb5" font-size="12">MySQL 8.0.24 or later, else the process fails</text>
  <line x1="500" y1="144" x2="500" y2="166" stroke="#c9cdd1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <polygon points="500,168 660,208 500,248 340,208" fill="#2f2f2f" stroke="#8a8f95" stroke-width="1.5"/>
  <text x="500" y="213" text-anchor="middle" fill="#e0e0e0" font-size="12">SHOW TABLES returns zero ?</text>
  <line x1="660" y1="208" x2="718" y2="208" stroke="#c9cdd1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="689" y="200" text-anchor="middle" fill="#c9cdd1" font-size="12">yes</text>

  <rect x="720" y="172" width="250" height="72" rx="8" fill="#2f2f2f" stroke="#8a8f95" stroke-width="1.5"/>
  <text x="845" y="194" text-anchor="middle" fill="#e0e0e0" font-size="12">import the baseline in order:</text>
  <text x="845" y="212" text-anchor="middle" fill="#a7aeb5" font-size="12">sql/current/10-cpat-tables.sql</text>
  <text x="845" y="230" text-anchor="middle" fill="#a7aeb5" font-size="12">sql/current/20-cpat-static.sql</text>
  <path d="M 845 244 L 845 280 L 500 280" fill="none" stroke="#c9cdd1" stroke-width="1.5"/>

  <line x1="500" y1="248" x2="500" y2="298" stroke="#c9cdd1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="512" y="266" fill="#c9cdd1" font-size="12">no</text>

  <rect x="300" y="300" width="400" height="56" rx="8" fill="#14304a" stroke="#249ee8" stroke-width="1.5"/>
  <text x="500" y="322" text-anchor="middle" fill="#e0e0e0">Umzug: compare Services/migrations/NNNN.js</text>
  <text x="500" y="342" text-anchor="middle" fill="#a7aeb5" font-size="12">with the rows in the _migrations table</text>
  <line x1="500" y1="356" x2="500" y2="378" stroke="#c9cdd1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="380" width="400" height="76" rx="8" fill="#14304a" stroke="#249ee8" stroke-width="1.5"/>
  <text x="500" y="402" text-anchor="middle" fill="#e0e0e0">for each pending file: MigrationHandler.up()</text>
  <text x="500" y="422" text-anchor="middle" fill="#a7aeb5" font-size="12">begin transaction, run each statement, commit;</text>
  <text x="500" y="440" text-anchor="middle" fill="#a7aeb5" font-size="12">rollback and fail the start on error</text>
  <line x1="500" y1="456" x2="500" y2="478" stroke="#c9cdd1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="480" width="400" height="44" rx="8" fill="#14304a" stroke="#249ee8" stroke-width="1.5"/>
  <text x="500" y="507" text-anchor="middle" fill="#e0e0e0">record the file name in _migrations</text>
  <line x1="500" y1="524" x2="500" y2="546" stroke="#c9cdd1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <polygon points="500,548 660,588 500,628 340,588" fill="#2f2f2f" stroke="#8a8f95" stroke-width="1.5"/>
  <text x="500" y="593" text-anchor="middle" fill="#e0e0e0" font-size="12">CPAT_DB_REVERT set ?</text>
  <line x1="660" y1="588" x2="718" y2="588" stroke="#c9cdd1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="689" y="580" text-anchor="middle" fill="#c9cdd1" font-size="12">yes</text>
  <rect x="720" y="556" width="250" height="64" rx="8" fill="#2f2f2f" stroke="#8a8f95" stroke-width="1.5"/>
  <text x="845" y="580" text-anchor="middle" fill="#e0e0e0" font-size="12">run down() of the newest migration,</text>
  <text x="845" y="598" text-anchor="middle" fill="#e0e0e0" font-size="12">then stop instead of serving</text>

  <line x1="500" y1="628" x2="500" y2="650" stroke="#c9cdd1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="512" y="644" fill="#c9cdd1" font-size="12">no</text>
  <text x="500" y="670" text-anchor="middle" fill="#e0e0e0" font-weight="bold">database ready</text>

  <rect x="30" y="380" width="250" height="144" rx="8" fill="#3a2d05" stroke="#f9bf26" stroke-width="1.5"/>
  <text x="155" y="404" text-anchor="middle" fill="#f9bf26" font-weight="bold" font-size="13">Implicit commits</text>
  <text x="155" y="428" text-anchor="middle" fill="#e0e0e0" font-size="12">MySQL commits before and after</text>
  <text x="155" y="446" text-anchor="middle" fill="#e0e0e0" font-size="12">every DDL statement. A file that fails</text>
  <text x="155" y="464" text-anchor="middle" fill="#e0e0e0" font-size="12">after an ALTER TABLE leaves it applied</text>
  <text x="155" y="482" text-anchor="middle" fill="#e0e0e0" font-size="12">and the file unrecorded, so it re-runs.</text>
  <text x="155" y="506" text-anchor="middle" fill="#e0e0e0" font-size="12">Write statements that tolerate a re-run.</text>

  <rect x="30" y="172" width="250" height="72" rx="8" fill="#2f2f2f" stroke="#8a8f95" stroke-width="1.5"/>
  <text x="155" y="196" text-anchor="middle" fill="#e0e0e0" font-size="12">The baseline precedes migration 0000.js</text>
  <text x="155" y="214" text-anchor="middle" fill="#a7aeb5" font-size="12">and is never edited; 20-cpat-static.sql seeds</text>
  <text x="155" y="232" text-anchor="middle" fill="#a7aeb5" font-size="12">_migrations so fresh installs skip old files.</text>
</svg>
